name: Test and coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.25','1.26' ]    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      # Every module is tested even when one fails, and the step still fails if
      # any did. The loop runs under `bash -e`, so an unguarded failure used to
      # abort it: one flaky test in an early module meant every module after it
      # was silently never tested.
      - name: Run coverage
        run: |
          status=0
          for mod in $(find . -name 'go.mod' -not -path './.git/*'); do
            dir=$(dirname "$mod")
            echo "::group::Testing $dir"
            (cd "$dir" && go test -race -coverprofile="coverage.txt" -covermode=atomic "./...") || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: dnsoa/go     
          fail_ci_if_error: false # optional (default = false)
          # files: ./i18n/coverage.txt",./assert/coverage.txt" # optiona